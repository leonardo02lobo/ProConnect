# Stack de medición de rendimiento (línea base / after).
# Uso: docker-compose -p pc-perf -f perf/docker-compose.perf.yml up -d --build
name: pc-perf
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: perfroot
      MYSQL_DATABASE: proconnect
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - ./mysql/perf.cnf:/etc/mysql/conf.d/perf.cnf:ro
      - pc-perf-mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:23306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pperfroot"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M

  api:
    build:
      context: ..
      dockerfile: perf/docker/api.Dockerfile
    # Etiqueta por medición (baseline, pre, after-v2, after) para no reconstruir al comparar.
    image: pc-perf-api:${PERF_API_TAG:-local}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Variables de la API desde fix-critical-risks (application.yml). El usuario `app`
      # es el que se filtra en performance_schema para contar sentencias por request.
      SERVER_PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/proconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: app
      DB_PASSWORD: apppass
      # Secreto desechable solo para el stack de medición (>= 32 bytes).
      JWT_SECRET: perf-local-only-jwt-secret-not-for-prod-0123456789
      JWT_TTL: PT12H
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:24321
      # El benchmark hace login de varios usuarios desde la misma IP.
      RATE_LIMIT_AUTH_PER_MINUTE: "100000"
      RATE_LIMIT_MAX_FAILURES: "100000"
      # Sin logging de SQL: no se mide el coste de imprimir cada sentencia.
      JPA_SHOW_SQL: "false"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      JAVA_OPTS: "-Xms512m -Xmx768m"
    ports:
      - "127.0.0.1:28080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1280M

volumes:
  pc-perf-mysql:
