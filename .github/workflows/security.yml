name: security

# Escaneos de seguridad (verify-web-security, design D7).
# - PR: gitleaks sobre los commits del PR, CodeQL, Semgrep, Dependency-Check y npm audit.
# - Cron semanal: lo mismo + gitleaks sobre TODO el historial.
# Política: bloquean los hallazgos de severidad alta/crítica (BLOCKING=true); el resto se reporta
# en GitHub Code Scanning / artifacts. Excepciones: .gitleaksignore, .security/*-suppressions.xml.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # lunes 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # false = modo reporte (los jobs no fallan); true = bloquean alto/crítico.
  BLOCKING: 'false'

jobs:
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan PR commits / full history
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="--all"   # cron / push / manual: todo el historial
          fi
          echo "gitleaks log-opts: $range"
          rc=0
          docker run --rm -v "$PWD":/repo -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --log-opts="$range" --redact --verbose -f sarif -r /repo/gitleaks.sarif || rc=$?
          echo "gitleaks exit code: $rc"
          if [ "$rc" -ne 0 ] && [ "$BLOCKING" = "true" ]; then exit "$rc"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - BackendProConnect   # backend legacy, se retira en cleanup-codebase
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep (OWASP Top 10, Java, TypeScript, secrets)
        run: |
          semgrep scan --metrics=off --exclude BackendProConnect \
            --config p/owasp-top-ten --config p/java --config p/typescript --config p/secrets \
            --sarif -o semgrep.sarif
          # Bloqueo solo por severidad ERROR (alta).
          rc=0
          semgrep scan --metrics=off --exclude BackendProConnect --severity ERROR --error \
            --config p/owasp-top-ten --config p/java --config p/typescript --config p/secrets || rc=$?
          if [ "$rc" -ne 0 ] && [ "$BLOCKING" = "true" ]; then exit "$rc"; fi
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependency-check:
    name: sca maven (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [backProconnect, gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      # Base de datos NVD cacheada entre ejecuciones (la descarga inicial es lenta sin API key).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.odc-data
          key: odc-${{ runner.os }}-${{ github.run_id }}
          restore-keys: odc-${{ runner.os }}-
      - name: OWASP Dependency-Check (falla con CVSS >= 7)
        working-directory: ${{ matrix.service }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::Sin secret NVD_API_KEY la actualización de la NVD es muy lenta. Añádelo en Settings → Secrets."
          fi
          fail=7; [ "$BLOCKING" = "true" ] || fail=11
          ./mvnw -B -ntp org.owasp:dependency-check-maven:12.2.2:check \
            -DdataDirectory="$HOME/.odc-data" -DnvdApiKey="$NVD_API_KEY" \
            -DfailBuildOnCVSS=$fail -Dformats=HTML,JSON,SARIF \
            -DsuppressionFiles="$GITHUB_WORKSPACE/.security/dependency-check-suppressions.xml" \
            -DossindexAnalyzerEnabled=false -DretireJsAnalyzerEnabled=false \
            -DnodeAnalyzerEnabled=false -DnodeAuditAnalyzerEnabled=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-check-${{ matrix.service }}
          path: ${{ matrix.service }}/target/dependency-check-report.*
          if-no-files-found: ignore

  npm-audit:
    name: sca npm (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [NodeTsPosts, FrontedProConnect, e2e]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: npm audit (alto/crítico)
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json");console.log(JSON.stringify(a.metadata?.vulnerabilities??a,null,1))'
          rc=0; npm audit --audit-level=high || rc=$?
          if [ "$rc" -ne 0 ] && [ "$BLOCKING" = "true" ]; then exit "$rc"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: npm-audit-${{ matrix.project }}
          path: ${{ matrix.project }}/npm-audit.json
          if-no-files-found: ignore
