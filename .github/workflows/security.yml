name: security

# Escaneos de seguridad de lo que vive en la raíz del principal (split-into-polyrepo, D3): e2e/, perf/,
# security/, orchestration/, workflows. Los componentes se escanean en su propio repo. Sin GitHub Code Scanning
# (repo privado): los informes quedan como artifacts y cada job FALLA ante hallazgos alto/crítico.
# El historial del principal conserva los secretos históricos ya triados en .gitleaksignore (rotación: README).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # lunes 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan PR commits / full history
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="--all"   # cron / push / manual: todo el historial
          fi
          echo "gitleaks log-opts: $range"
          docker run --rm -v "$PWD":/repo -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --log-opts="$range" --redact --verbose -f sarif -r /repo/gitleaks.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  semgrep:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Sin submódulos en el checkout: solo se analiza la raíz. `docker run` (no `container:`) para act.
      - name: Semgrep (OWASP Top 10, TypeScript, secrets, GitHub Actions)
        run: |
          sg() { docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:1.95.0 semgrep scan --metrics=off \
                   --exclude frontend --exclude backend --exclude services \
                   --config p/owasp-top-ten --config p/typescript --config p/secrets --config p/github-actions "$@"; }
          sg --sarif -o semgrep.sarif || true
          sg --severity ERROR --error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  npm-audit:
    name: sca npm (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: npm audit (alto/crítico)
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json");console.log(JSON.stringify(a.metadata?.vulnerabilities??a,null,1))'
          npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: npm-audit-e2e
          path: e2e/npm-audit.json
          if-no-files-found: ignore
