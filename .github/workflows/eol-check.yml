name: eol-check

# Alerta temprana de fin de soporte (upgrade-spring-boot-4, spec platform-support): falla si la línea de
# Spring Boot de algún módulo Java está a menos de 60 días de su fin de soporte OSS (endoflife.date).
on:
  schedule:
    - cron: '17 6 * * 1'   # lunes 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'backProconnect/pom.xml'
      - 'gateway/pom.xml'
      - '.github/scripts/eol-check.py'
      - '.github/workflows/eol-check.yml'

permissions:
  contents: read

jobs:
  spring-boot-eol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check Spring Boot OSS support window
        env:
          EOL_MIN_DAYS: '60'
        run: python3 .github/scripts/eol-check.py backProconnect/pom.xml gateway/pom.xml
