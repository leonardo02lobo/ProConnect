name: ci

# CI propio del repo principal (split-into-polyrepo): solo lo que vive en la raíz. El build y los tests de cada
# componente se ejecutan en su repo (proconnect-frontend / -backend / -services); aquí no se clonan submódulos.
on:
  pull_request:          # every PR, whatever its base branch (stacked PRs included)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-typecheck:
    name: typecheck (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck E2E suite
        run: npx tsc --noEmit

  platform-lint:
    name: lint (workflows, scripts, openspec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color
      - name: shellcheck (scripts del principal)
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.10.0 \
            e2e/scripts/*.sh orchestration/scripts/*.sh security/dast/*.sh
      - name: OpenSpec (specs y changes válidos; cada proposal declara ## Repos)
        run: |
          npx --yes @fission-ai/openspec@1.6.0 validate --all --no-interactive
          ./orchestration/scripts/check-proposals.sh
