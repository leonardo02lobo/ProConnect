name: dast

# DAST autenticado (verify-web-security, tarea 1.3): stack E2E + usuario DAST + OWASP ZAP baseline.
# Falla ante alertas de riesgo alto o reglas FAIL de security/dast/rules.tsv (p. ej. falta la CSP).
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'   # lunes 04:41 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'services'           # puntero del submódulo (gateway + media)
      - 'frontend'
      - 'docker-compose.e2e.yml'
      - 'docker-compose.sec.yml'
      - 'security/dast/**'
      - '.github/workflows/dast.yml'

permissions:
  contents: read

concurrency:
  group: dast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: docker compose
      HAS_PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN != '' }}
    steps:
      # Submódulos privados (frontend/, backend/, services/): el checkout necesita PLATFORM_TOKEN
      # (GitHub App o fine-grained con Contents: Read en los 3 repos hijos). GITHUB_TOKEN no puede leerlos.
      - name: Require PLATFORM_TOKEN (private submodules)
        if: env.HAS_PLATFORM_TOKEN != 'true'
        run: |
          echo "::error title=PLATFORM_TOKEN::Falta el secret PLATFORM_TOKEN: sin él no se pueden clonar los submódulos privados (proconnect-frontend/-backend/-services). Créalo (GitHub App o token fine-grained con Contents: Read en los 3 repos hijos) en Settings → Secrets and variables → Actions. Ver README → Acciones del mantenedor."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          token: ${{ secrets.PLATFORM_TOKEN }}
          persist-credentials: false

      - name: Generate throwaway stack secrets
        run: |
          jwt=$(openssl rand -hex 32); db=$(openssl rand -hex 16)
          echo "::add-mask::$jwt"; echo "::add-mask::$db"
          echo "E2E_JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "E2E_DB_PASSWORD=$db" >> "$GITHUB_ENV"

      - name: Start E2E stack
        run: docker compose -p pc-dast -f docker-compose.e2e.yml -f docker-compose.sec.yml up -d --build --wait --wait-timeout 400

      - name: ZAP baseline (web + API, authenticated)
        env:
          WEB_URL: http://localhost:14321
          API_URL: http://localhost:18080
          OUT_DIR: ${{ github.workspace }}/zap-out
        run: ./security/dast/run-zap.sh

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: zap-out/
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p pc-dast -f docker-compose.e2e.yml -f docker-compose.sec.yml logs --no-color --tail=200 | sed -E 's/(pc_session=)[^;[:space:]]+/\1***/g'

      - name: Tear down
        if: always()
        run: docker compose -p pc-dast -f docker-compose.e2e.yml -f docker-compose.sec.yml down -v
