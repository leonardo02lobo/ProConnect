# Actualizaciones de dependencias del repo principal (verify-web-security 1.1; split-into-polyrepo: cada componente
# tiene su propio dependabot.yml en su repo). Semanal, agrupando parches/minors.
# upgrade-spring-boot-4 (ci-supply-chain): cooldown en TODAS las entradas para no adoptar versiones recién
# publicadas (posibles paquetes comprometidos): 7 días para todo (cubre el mínimo de 3 y los 7 de mayores de la spec;
# Semgrep dependabot-missing-cooldown exige >= 7). Las alertas de seguridad de Dependabot no esperan. Las actions van
# fijadas por SHA con comentario "# vX.Y.Z": Dependabot actualiza SHA y comentario.
version: 2
updates:
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /perf
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
  # Respaldo del bump automático (bump-submodules.yml): PR semanal si algún submódulo quedó atrás de su main.
  # Para que Dependabot lea los submódulos privados hay que darle acceso a los repos hijos (README → acciones).
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
