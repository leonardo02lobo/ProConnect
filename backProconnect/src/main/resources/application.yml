# Configuración de la API core. Todos los secretos salen de variables de entorno (ver .env.example).
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: backProconnect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/proconnect}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
  # SMTP de los correos de postulación. En dev/E2E apunta a Mailpit (localhost:1025, sin auth ni TLS).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          ssl:
            enable: ${MAIL_SSL:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

proconnect:
  jwt:
    # Obligatorio, >= 32 bytes. Sin valor por defecto: el arranque falla si falta.
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT24H}
  cookie:
    name: pc_session
    # Solo poner COOKIE_SECURE=false en desarrollo local sobre http.
    secure: ${COOKIE_SECURE:true}
  cors:
    # También es la allowlist de Origin/Referer para mutaciones (defensa CSRF).
    origins: ${CORS_ORIGINS:http://localhost:4321}
  security:
    # Proxies cuyo X-Forwarded-For se acepta (IP o CIDR, separados por comas). Pon aquí la red del gateway.
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1/32,::1/128}
  bootstrap:
    # Primer ADMIN (opcional): se crea al arrancar si no existe. Vacío = desactivado.
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${BOOTSTRAP_ADMIN_NAME:Administrador}
  mail:
    from: '${MAIL_FROM:"Respuesta a su solicitud de empleo" <no-reply@proconnect.local>}'
    retry:
      max-attempts: 3
      delay-ms: ${MAIL_RETRY_DELAY_MS:2000}
      multiplier: 2
  ratelimit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    max-failures: ${RATE_LIMIT_MAX_FAILURES:5}
    lockout: ${RATE_LIMIT_LOCKOUT:PT15M}

management:
  health:
    # Un SMTP caído no debe marcar la API como unhealthy (el correo es best-effort con reintentos).
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    # traceId (TraceIdFilter) en cada línea: correlaciona el log con el campo traceId de las respuestas de error.
    level: "%5p [%X{traceId:-}]"
