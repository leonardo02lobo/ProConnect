server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      default-filters:
        - StripPrefix=1
      routes:
        - id: subirImagen
          uri: http://localhost:3000
          predicates:
            - Path=/upload/**
            - Method=POST
        - id: uploads
          uri: http://localhost:3000
          predicates:
            - Path=/upload/**
            - Method=GET
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
